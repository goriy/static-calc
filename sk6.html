<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="MobileOptimized" content="176" />
    <meta name="HandheldFriendly" content="True" />
    <meta name="robots" content="noindex,nofollow" />

    <title>Очки СК (суббота)</title>
    <style>
        body {
            --bg-color: var(--tg-theme-bg-color, #fff);
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color, #222);
            font-size: 14px;
            margin: 0;
            padding: 0;
            color-scheme: var(--tg-color-scheme);
        }

        body.gray {
            background-color: var(--tg-theme-secondary-bg-color, #efefef);
        }

        a {
            color: var(--tg-theme-link-color, #2678b6);
        }

        .btn {
            font-size: 14px;
            padding: 10px 17px;
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #50a8eb);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
        }

        button {
            display: block;
            width: 100%;
            font-size: 14px;
            margin: 15px 0;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            background-color: var(--tg-theme-button-color, #50a8eb);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
        }

        .button_after_text {
            /*display: block;*/
            display: table-cell;
            width: 100%;
            height: 100%;
            font-size: 14px;
            margin: 0px 1px;
            padding: 12px 10px;
        }

        .main-container {
            padding: 15px;
        }

        .list-header {
            text-transform: uppercase;
            font-size: .92em;
            color: var(--tg-theme-hint-color, #ccc);
            margin: 0 0 10px;
        }

        a.list-group-item,
        button.list-group-item {
            color: var(--tg-theme-text-color, #222);
        }

        .main-container p {
            margin: 0 0 10px;
        }

        .main-container pre,
        .main-container > .btn {
            margin: 0 0 7px;
        }

        .main-container pre + .hint,
        .main-container > .btn + .hint {
            text-align: center;
            margin: 0 0 15px;
        }

        button[disabled] {
            opacity: 0.6;
            cursor: auto;
            pointer-events: none;
        }

        button.close_btn {
            /*position: fixed;*/
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 0;
            margin: 0;
            padding: 16px 20px;
            text-transform: uppercase;
        }

        input[type="text"],input[type="numeric"] {
            /* display: block; */
            box-sizing: border-box;
            font-size: 16px;
            width: 100%;
            padding: 12px 20px;
            margin: 0px 0px 1px 0px;
            border: 1px solid var(--tg-theme-link-color, #000);
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-radius: 4px;
            color: var(--tg-theme-text-color, #222222);
            text-align: start;
        }

        input[type="text"]::-webkit-input-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }
        input[type="text"]::-moz-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }
        input[type="text"]:-ms-input-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }

        input[type="numeric"]::-webkit-input-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }
        input[type="numeric"]::-moz-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }
        input[type="numeric"]:-ms-input-placeholder {
            color: var(--tg-theme-hint-color, #ccc);
        }

        .input[data-placeholder] {
            position: relative;
        }

        .input[data-placeholder]:empty:before {
            position: absolute;
            left: 0;
            right: 0;
            content: attr(data-placeholder);
            color: var(--tg-theme-hint-color, #ccc);
            padding: 0 20px;
            font-weight: normal;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        section {
            padding: 1px 15px 15px 15px;
            text-align: center;
            background-color: var(--bg-color, #ffffff);
        }

        section#top_sect {
            background-color: var(--tg-theme-bg-color, #ffffff);
        }

        section#top_sect.second {
            background-color: var(--tg-theme-secondary-bg-color, #efefef);
        }

        .second {
            background-color: var(--tg-theme-secondary-bg-color, #efefef);
            max-width: 800px;
        }

        hr {
          width: 100%;
          max-width: 830px;
          height: 2px;
          margin: 0px;
          border: 0 none;
          background: #aaa;
          background-image: linear-gradient(to right, #ddd, #aaa, #ddd);
        }

        section .sect_row {
            margin: 10px 0;
        }

        section + section {
            padding: 0 15px 65px;
        }

        p {
            margin: 40px 0 15px;
        }

        ul {
            text-align: left;
        }

        li {
            color: var(--tg-theme-hint-color, #a8a8a8);
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 7px;
        }

        pre {
            background: rgba(0, 0, 0, .07);
            color: var(--tg-theme-text-color, #222);
            font-size: 12px;
            border: none;
            border-radius: 4px;
            padding: 8px;
            margin: 7px 0;
            word-break: break-word;
            white-space: pre-wrap;
            text-align: left;
        }

        .dark pre {
            background: rgba(255, 255, 255, .15);
        }

        .chat_img {
            width: 30px;
            border-radius: 15px;
            margin-right: 10px;
        }

        .columns {
            display: flex;
        }

        .columns > * {
            flex-grow: 1;
        }

        .hint {
            font-size: .8em;
            color: var(--tg-theme-hint-color, #a8a8a8);
        }

        .ok {
            color: green;
        }

        .err {
            color: red;
        }

        .status_need {
            display: none;
        }

        #fixed_wrap {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            transform: translateY(100vh);
        }

        small {
            font-size: 12px;
        }
        .small {
            font-size: 12px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table td {
            padding: 2px;
        }
        .table-bordered {
            border: 1px solid var(--tg-theme-hint-color, #ccc);
        }
        .table-bordered th, .table-bordered td {
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 4px;
        }
        .table.small button {
            padding: 3px 6px;
            font-size: 12px;
            margin: 4px 0;
        }
        .table.small input {
            padding: 3px 6px;
            font-size: 12px;
            margin: 4px 0;
        }
        .ra {
            text-align: left;
            vertical-align: bottom;
        }
        .ri {
            text-align: left;
            vertical-align: middle;
        }

        .timer_title {
            display: block;
            /*box-sizing: border-box;*/
            font-size: 14px;
            width: 100%;
            padding: 10px 1px 0px 0px;
            margin: 0px 0px 0px 0px;
            /*border: 1px solid var(--tg-theme-link-color, #000);*/
            /*background-color: var(--tg-theme-bg-color, #ffffff);*/
            border-radius: 4px;
            color: var(--tg-theme-text-color, #222222);
            text-align: left;
        }

        .timer {
            display: block;
            box-sizing: border-box;
            font-size: 32px;
            width: 100%;
            padding: 12px 20px;
            margin: 5px 0;
            /*border: 1px solid var(--tg-theme-link-color, #000);*/
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-radius: 4px;
            color: var(--tg-theme-text-color, #222222);
            text-align: center;
        }

        .grid {
          display: grid;
          grid-gap: 10px;
          grid-template-columns: 50px 1fr;
        }
    </style>
</head>

<body class="">

<datalist id="scores">
  <option value="10 000 000"></option>
  <option value="20 000 000"></option>
  <option value="30 000 000"></option>
  <option value="40 000 000"></option>
  <option value="50 000 000"></option>
  <option value="60 000 000"></option>
  <option value="70 000 000"></option>
  <option value="80 000 000"></option>
  <option value="90 000 000"></option>
  <option value="100 000 000"></option>
  <option value="110 000 000"></option>
  <option value="120 000 000"></option>
  <option value="130 000 000"></option>
  <option value="140 000 000"></option>
  <option value="150 000 000"></option>
  <option value="160 000 000"></option>
  <option value="170 000 000"></option>
  <option value="180 000 000"></option>
  <option value="190 000 000"></option>
</datalist>

<section id="top_sect" class="second">
    <table  class="timer_title">
    <td class="ra" colspan="4">Сколько очков есть:</td>
    </tr><tr>
    <td class="ri"><input type="numeric" list="scores" value="80 000 000" placeholder="Есть..." id="value1" inputmode="numeric" onkeyup="return do_calc();" onchange="return do_calc();" /></td>
    <td><button class="button_after_text" onclick="add_value('value1', 1000000);">+ млн</button></td>
    <td><button class="button_after_text" onclick="add_value('value1', -1000000);">- млн</button></td>
    <td><button class="button_after_text" onclick="clear_val('value1');">x</button></td>
    </tr>
    <tr>
    <td class="ra" colspan="4">Сколько очков НАДО (не более):</td>
    </tr><tr>
    <td class="ri"><input type="numeric" list="scores" value="90 000 000" placeholder="Надо..." id="value2" inputmode="numeric" onkeyup="return do_calc();" onchange="return do_calc();" /></td>
    <td><button class="button_after_text" onclick="add_value('value2', 1000000);">+ млн</button></td>
    <td><button class="button_after_text" onclick="add_value('value2', -1000000);">- млн</button></td>
    <td><button class="button_after_text" onclick="clear_val('value2');">x</button></td>
    </tr>
    </table>
</section>
<hr>
<section id="next_sect" class="second">
    <div class="timer_title">
    Карточек SSR (желтых):
    </div>
    <div class="grid">
    <img src="yellow-card.png" style="height: 46px;" class="timer_title">
    <div class="timer" id="result1">
    -
    </div></div>
    <button onclick="add_cards('result1', 14000);">Добавить столько</button>

    <div class="timer_title">
    Карточек SR (фиолетовых):
    </div>
    <div class="grid">
    <img src="purple-card.png" style="height: 46px;" class="timer_title">
    <div class="timer" id="result2">
    -
    </div></div>
    <button onclick="add_cards('result2', 3500);">Добавить столько</button>
</section>
<script type="application/javascript">

function do_calc() {
  const v1 = document.getElementById('value1');
  const v2 = document.getElementById('value2');
  const r1 = document.getElementById('result1');
  const r2 = document.getElementById('result2');


  raw_val1 = v1.value.replace(/[ ,.]/g, '');
  raw_val2 = v2.value.replace(/[ ,.]/g, '');

  df = parseFloat(raw_val2) - parseFloat(raw_val1);

  c1 = Math.floor(df / 14000.0);
  c2 = Math.floor(df / 3500.0);

  r1.innerHTML = c1.toString();
  r2.innerHTML = c2.toString();
  return false;
}

function add_cards(cards_id, nominal) {
  const v1 = document.getElementById('value1');
  const r1 = document.getElementById(cards_id);

  var raw_val1 = parseInt(v1.value.replace(/[ ,.]/g, ''));
  var raw_val2 = parseInt(r1.innerHTML);

  new_val = raw_val1 + raw_val2 * nominal;
  nv = new_val.toString();
  fs = nv.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  v1.value = fs;
  do_calc();
  return false;
}

function add_value(value_id, amount) {
  const v1 = document.getElementById(value_id);
  var raw_val1 = parseInt(v1.value.replace(/[ ,.]/g, ''));
  if (isNaN(raw_val1)) {raw_val1 = 0;}
  new_val = raw_val1 + amount;
  nv = new_val.toString();
  fs = nv.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  v1.value = fs;
  do_calc();
  return false;
}

function clear_val(value_id) {
  const v1 = document.getElementById(value_id);
  v1.value = '';
  do_calc();
  return false;
}

function remove_sep(e) {
  var event = e || window.event;
  var target = event.target;
  var val = target.value.replace(/[ ,.]/g, '');
  target.value = val;
}

function add_sep(e) {
  var event = e || window.event;
  var target = event.target;
  var val = target.value.replace(/[ ,.]/g, '');
  fs = val.replace(/\B(?=(\d{3})+(?!\d))/g, " ");

  target.value = fs;
}


const v1 = document.getElementById('value1');
const v2 = document.getElementById('value2');

v1.addEventListener('blur', add_sep);
v2.addEventListener('blur', add_sep);
//v1.addEventListener('focus', remove_sep);
//v2.addEventListener('focus', remove_sep);


do_calc();

</script>

</body>
</html>
